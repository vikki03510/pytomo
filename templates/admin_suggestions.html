    <a href="{{ url_for('admin_suggestions') }}"

        <button>Г</button>
        <button>Ґ</button>
        <button>Д</button>
        <button>Е</button>
        <button>Є</button>
        <button>Ж</button>
        <button>З</button>

        <button>Ї</button>
        <button>Й</button>
        <button>К</button>
        <button>Л</button>

      <div class="alphabet-row">

        <button>Н</button>
        <button>О</button>
        <button>П</button>
        <button>Р</button>
        <button>С</button>
        <button>Т</button>
        <button>У</button>

        <button>Х</button>
        <button>Ц</button>
        <button>Ч</button>
        <button>Ш</button>
        <button>Щ</button>
        <button>Ь</button>
        <button>Ю</button>
        <button>Я</button>

    </div>

  </section>

      <h1>
        Англізми, запропоновані користувачами

    </div>

    <div class="database-grid">

      <div class="word-row">

                  data-confirm="Ви впевнені, що хочете видалити англізм з пропозицій?">

      </div>

      <div class="word-row">

        <span>артбук</span>

        <div class="actions">

            <img src="{{ url_for('static', filename='images/іконка_смітник.svg') }}"
                 alt="Видалити" />

          </button>

        </div>

      </div>

      <div class="word-row">

        <span>асист</span>

        <div class="actions">

          <a href="{{ url_for('admin_edit_suggestion') }}"
             class="icon-button">

            <img src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                 alt="Редагувати" />

          </a>

          <button class="icon-button delete-item-button"

                  data-confirm="Ви впевнені, що хочете видалити англізм з пропозицій?">

            <img src="{{ url_for('static', filename='images/іконка_смітник.svg') }}"

        </div>

      <div class="word-row">

                  data-confirm="Ви впевнені, що хочете видалити англізм з пропозицій?">

                 alt="Редагувати" />

                  type="button"

                 alt="Видалити" />

          </button>

        </div>

    </div>

    <div class="pagination">

      <button class="page-button disabled"
              type="button">

        «

      </button>

      <button class="page-button disabled"
              type="button">

        ‹

      <button class="page-button disabled current-page"

      <button class="page-button active-page"
              type="button">

<footer class="admin-footer">

  <a href="{{ url_for('improve') }}"
     class="user-site-button">

    Користувацький сайт

  </a>

</footer>

<div id="confirm-popup"
     class="confirm-popup">

  <div class="confirm-window">

    <div class="confirm-header">
      <h2>Увага</h2>
    </div>

    <p class="confirm-text">
      Ви впевнені, що хочете виконати цю дію?
    </p>

    <div class="confirm-actions">

      <button class="confirm-no"
              type="button">

        Ні

      </button>

      <button class="confirm-yes"
              type="button">

        Так

      </button>

    </div>

  </div>

</div>

<script>
  const confirmPopup = document.getElementById("confirm-popup");
  const confirmText = document.querySelector(".confirm-text");
  const confirmYes = document.querySelector(".confirm-yes");
  const confirmNo = document.querySelector(".confirm-no");

  let rowToDelete = null;

  document.querySelectorAll("[data-confirm]").forEach(button => {
    button.addEventListener("click", event => {
      event.preventDefault();

      confirmText.textContent = button.dataset.confirm;

      rowToDelete = button.closest(".word-row");

      confirmPopup.classList.add("show");
    });
  });

  confirmNo.addEventListener("click", () => {
    confirmPopup.classList.remove("show");
    rowToDelete = null;
  });

  confirmYes.addEventListener("click", () => {
    if (rowToDelete) rowToDelete.remove();

    confirmPopup.classList.remove("show");
    rowToDelete = null;
  });
</script>

</body>
</html>
