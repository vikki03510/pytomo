<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Адмін | Пропозиції</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/admin_suggestions.css') }}">
</head>

<body>

<header class="admin-header">

  <img class="logo"
       src="{{ url_for('static', filename='images/Лого.svg') }}"
       alt="Платформа Питомо" />

  <nav class="admin-nav">

    <a href="{{ url_for('admin_database') }}"
       class="admin-nav-item">

      <img src="{{ url_for('static', filename='images/іконка_база_даних.svg') }}"
           alt="" />

      <div>
        <span>База даних</span>
        <small>Редагувати базу</small>
      </div>

    </a>

    <a href="{{ url_for('admin_suggestions') }}"
       class="admin-nav-item active">

      <img src="{{ url_for('static', filename='images/іконка_лампочка.svg') }}"
           alt="" />

      <div>
        <span>Пропозиції</span>
        <small>Ідеї відповідників</small>
      </div>

    </a>

    <a href="{{ url_for('admin_messages') }}"
       class="admin-nav-item">

      <img src="{{ url_for('static', filename='images/іконка_повідомлення.svg') }}"
           alt="" />

      <div>
        <span>Повідомлення</span>
        <small>Зв’язок із користувачами</small>
      </div>

    </a>

  </nav>

</header>

<main>

  <section class="admin-search-section">

    <form class="admin-search-form">

      <input type="text"
             placeholder="Введіть англізм для пошуку" />

      <button type="submit"
              aria-label="Пошук">

        <img src="{{ url_for('static', filename='images/іконка_пошук.svg') }}"
             alt="" />

      </button>

    </form>

  </section>

  <section class="alphabet-section">

    <img class="alphabet-bg"
         src="{{ url_for('static', filename='images/alphabet_background.svg') }}"
         alt="" />

    <div class="alphabet-buttons">

      <div class="alphabet-row">

        <button class="letter-button letter-active"
                data-letter="ВСЕ">

          Все

        </button>

        <button class="letter-button"
                data-letter="А">

          А

        </button>

        <button class="letter-button"
                data-letter="Б">

          Б

        </button>

        <button class="letter-button"
                data-letter="В">

          В

        </button>

        <button class="letter-button"
                data-letter="Г">

          Г

        </button>

        <button class="letter-button"
                data-letter="Ґ">

          Ґ

        </button>

        <button class="letter-button"
                data-letter="Д">

          Д

        </button>

        <button class="letter-button"
                data-letter="Е">

          Е

        </button>

        <button class="letter-button"
                data-letter="Є">

          Є

        </button>

        <button class="letter-button"
                data-letter="Ж">

          Ж

        </button>

        <button class="letter-button"
                data-letter="З">

          З

        </button>

        <button class="letter-button"
                data-letter="И">

          И

        </button>

        <button class="letter-button"
                data-letter="І">

          І

        </button>

        <button class="letter-button"
                data-letter="Ї">

          Ї

        </button>

        <button class="letter-button"
                data-letter="Й">

          Й

        </button>

        <button class="letter-button"
                data-letter="К">

          К

        </button>

        <button class="letter-button"
                data-letter="Л">

          Л

        </button>

        <button class="letter-button"
                data-letter="М">

          М

        </button>

      </div>

      <div class="alphabet-row">

        <button class="letter-button"
                data-letter="Н">

          Н

        </button>

        <button class="letter-button"
                data-letter="О">

          О

        </button>

        <button class="letter-button"
                data-letter="П">

          П

        </button>

        <button class="letter-button"
                data-letter="Р">

          Р

        </button>

        <button class="letter-button"
                data-letter="С">

          С

        </button>

        <button class="letter-button"
                data-letter="Т">

          Т

        </button>

        <button class="letter-button"
                data-letter="У">

          У

        </button>

        <button class="letter-button"
                data-letter="Ф">

          Ф

        </button>

        <button class="letter-button"
                data-letter="Х">

          Х

        </button>

        <button class="letter-button"
                data-letter="Ц">

          Ц

        </button>

        <button class="letter-button"
                data-letter="Ч">

          Ч

        </button>

        <button class="letter-button"
                data-letter="Ш">

          Ш

        </button>

        <button class="letter-button"
                data-letter="Щ">

          Щ

        </button>

        <button class="letter-button"
                data-letter="Ь">

          Ь

        </button>

        <button class="letter-button"
                data-letter="Ю">

          Ю

        </button>

        <button class="letter-button"
                data-letter="Я">

          Я

        </button>

      </div>

    </div>

  </section>

  <section class="database-section">

    <div class="database-header suggestions-header">

      <h1>
        Англізми, запропоновані користувачами
      </h1>

    </div>

	<div class="database-grid">

	  {% for suggestion in suggestions %}

	  <div class="word-row"
		   data-id="{{ suggestion['ID'] }}"
		   data-letter="{{ suggestion['Англізм'][0]|upper }}"
		   data-word="{{ suggestion['Англізм']|lower }}">

		<span>

		  {{ suggestion["Англізм"] }}

		</span>

		<div class="actions">

		  <a href="{{ url_for('admin_edit_suggestion',
							  suggestion_id=suggestion['ID']) }}"
			 class="icon-button">

			<img src="{{ url_for('static',
								 filename='images/іконка_редагувати.svg') }}"
				 alt="Редагувати" />

		  </a>

		  <button class="icon-button delete-item-button"
				  type="button"
				  data-id="{{ suggestion['ID'] }}"
				  data-confirm="Ви впевнені, що хочете видалити англізм з пропозицій?">

			<img src="{{ url_for('static',
								 filename='images/іконка_смітник.svg') }}"
				 alt="Видалити" />

		  </button>

		</div>

	  </div>

	  {% endfor %}

	</div>
	
	<div id="empty-message"
     class="empty-message">

  Список порожній

	</div>

    <div class="pagination"
         id="pagination">

    </div>

  </section>

</main>

<footer class="admin-footer">

  <a href="{{ url_for('improve') }}"
     class="user-site-button">

    Користувацький сайт

  </a>

</footer>

<div id="confirm-popup"
     class="confirm-popup">

  <div class="confirm-window">

    <div class="confirm-header">
      <h2>Увага</h2>
    </div>

    <p class="confirm-text">
      Ви впевнені, що хочете виконати цю дію?
    </p>

    <div class="confirm-actions">

      <button class="confirm-no"
              type="button">

        Ні

      </button>

      <button class="confirm-yes"
              type="button">

        Так

      </button>

    </div>

  </div>

</div>

<script>

  const confirmPopup = document.getElementById("confirm-popup");

  const confirmText = document.querySelector(".confirm-text");

  const confirmYes = document.querySelector(".confirm-yes");

  const confirmNo = document.querySelector(".confirm-no");

  const searchInput = document.querySelector(
    ".admin-search-form input"
  );

  const letterButtons = document.querySelectorAll(
    ".letter-button"
  );

  const pagination = document.querySelector(
    ".pagination"
  );

  const databaseGrid = document.querySelector(
    ".database-grid"
  );


  // =========================
  // ДОДАЄМО ЛІТЕРИ СЛОВАМ
  // =========================

  const rows = Array.from(
    document.querySelectorAll(".word-row")
  );

  rows.forEach(row => {

    const word = row.querySelector("span")
      .textContent
      .trim();

    row.dataset.word = word.toLowerCase();

    row.dataset.letter = word[0].toUpperCase();

  });


  // =========================
  // ОНОВЛЮЄМО СПИСОК
  // =========================

  let allRows = Array.from(
    document.querySelectorAll(".word-row")
  );

  let currentLetter = "ВСЕ";

  let currentPage = 1;

  const rowsPerPage = 6;

  let rowToDelete = null;


  // =========================
  // ФІЛЬТР
  // =========================

function getFilteredRows() {

  const searchValue = searchInput.value
    .trim()
    .toLowerCase();

  return allRows.filter(row => {

    const matchesLetter =

      currentLetter === "ВСЕ"

      ||

      row.dataset.letter === currentLetter;

    const matchesSearch =
      row.dataset.word.includes(searchValue);

    return matchesLetter && matchesSearch;

  });

}


// =========================
// РЕНДЕР РЯДКІВ
// =========================

function renderRows() {

  const filteredRows = getFilteredRows();

  const emptyMessage =
    document.getElementById("empty-message");

  allRows.forEach(row => {
    row.style.display = "none";
  });

  const start =
    (currentPage - 1) * rowsPerPage;

  const end =
    start + rowsPerPage;

  filteredRows
    .slice(start, end)
    .forEach(row => {
      row.style.display = "";
    });


  // =========================
  // СПИСОК ПОРОЖНІЙ
  // =========================

  if (filteredRows.length === 0) {

    emptyMessage.style.display = "flex";

  } else {

    emptyMessage.style.display = "none";

  }

  renderPagination(filteredRows.length);

  attachDeleteEvents();

}


// =========================
// ПАГІНАЦІЯ
// =========================

function renderPagination(totalRows) {

  pagination.innerHTML = "";

  const totalPages = Math.ceil(
    totalRows / rowsPerPage
  );

  if (totalPages <= 1) {
    return;
  }


  // =========================
  // « ПЕРША
  // =========================

  const firstButton =
    document.createElement("button");

  firstButton.type = "button";

  firstButton.innerHTML = "&laquo;";

  firstButton.className =
    currentPage === 1
      ? "page-button page-arrow disabled"
	  : "page-button page-arrow active-page";

  firstButton.disabled =
    currentPage === 1;

  firstButton.addEventListener("click", () => {

    currentPage = 1;

    renderRows();

  });

  pagination.appendChild(firstButton);


  // =========================
  // ‹ НАЗАД
  // =========================

  const prevButton =
    document.createElement("button");

  prevButton.type = "button";

  prevButton.innerHTML = "&lsaquo;";

  prevButton.className =
    currentPage === 1
      ? "page-button page-arrow disabled"
	  : "page-button page-arrow active-page";

  prevButton.disabled =
    currentPage === 1;

  prevButton.addEventListener("click", () => {

    if (currentPage > 1) {

      currentPage--;

      renderRows();

    }

  });

  pagination.appendChild(prevButton);


  // =========================
  // ТІЛЬКИ 4 СТОРІНКИ
  // =========================

  let startPage =
    Math.max(currentPage - 1, 1);

  let endPage =
    Math.min(startPage + 3, totalPages);

  if (endPage - startPage < 3) {

    startPage =
      Math.max(endPage - 3, 1);

  }


  for (let i = startPage; i <= endPage; i++) {

    const button =
      document.createElement("button");

    button.type = "button";

    button.textContent = i;

    button.className =
      i === currentPage
        ? "page-button page-number disabled current-page"
        : "page-button page-number active-page";

    button.addEventListener("click", () => {

      currentPage = i;

      renderRows();

    });

    pagination.appendChild(button);

  }


  // =========================
  // › ВПЕРЕД
  // =========================

  const nextButton =
    document.createElement("button");

  nextButton.type = "button";

  nextButton.innerHTML = "&rsaquo;";

  nextButton.className =
    currentPage === totalPages
      ? "page-button page-arrow disabled"
	  : "page-button page-arrow active-page";

  nextButton.disabled =
    currentPage === totalPages;

  nextButton.addEventListener("click", () => {

    if (currentPage < totalPages) {

      currentPage++;

      renderRows();

    }

  });

  pagination.appendChild(nextButton);


  // =========================
  // » ОСТАННЯ
  // =========================

  const lastButton =
    document.createElement("button");

  lastButton.type = "button";

  lastButton.innerHTML = "&raquo;";

  lastButton.className =
    currentPage === totalPages
      ? "page-button page-arrow disabled"
	  : "page-button page-arrow active-page";

  lastButton.disabled =
    currentPage === totalPages;

  lastButton.addEventListener("click", () => {

    currentPage = totalPages;

    renderRows();

  });

  pagination.appendChild(lastButton);

}


  // =========================
  // ПОШУК
  // =========================

  searchInput.addEventListener("input", () => {

    currentPage = 1;

    renderRows();

  });


  // =========================
  // ЛІТЕРИ
  // =========================

  letterButtons.forEach(button => {

    button.addEventListener("click", () => {

      letterButtons.forEach(btn => {
        btn.classList.remove("letter-active");
      });

      button.classList.add("letter-active");

      currentLetter =
        button.dataset.letter;

      currentPage = 1;

      renderRows();

    });

  });


  // =========================
  // DELETE
  // =========================

  function attachDeleteEvents() {

    document.querySelectorAll("[data-confirm]")
      .forEach(button => {

        button.onclick = event => {

          event.preventDefault();

          confirmText.textContent =
            button.dataset.confirm;

          rowToDelete =
            button.closest(".word-row");

          confirmPopup.classList.add("show");

        };

      });

  }


  confirmNo.addEventListener("click", () => {

    confirmPopup.classList.remove("show");

    rowToDelete = null;

  });


  confirmYes.addEventListener("click", () => {

    if (rowToDelete) {

      rowToDelete.remove();

      allRows = Array.from(
        document.querySelectorAll(".word-row")
      );

      renderRows();

    }

    confirmPopup.classList.remove("show");

    rowToDelete = null;

  });


  // =========================
  // START
  // =========================

  renderRows();

</script>

</body>
</html>
