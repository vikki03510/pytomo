<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Адмін | Редагування англізма</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/admin_edit_anglicism.css') }}"
  />
</head>

<body>

<header class="admin-header">

  <img
    class="logo"
    src="{{ url_for('static', filename='images/Лого.svg') }}"
    alt="Платформа Питомо"
  />

  <nav class="admin-nav">

    <a
      href="{{ url_for('admin_database') }}"
      class="admin-nav-item active"
    >

      <img
        src="{{ url_for('static', filename='images/іконка_база_даних.svg') }}"
        alt=""
      />

      <div>
        <span>База даних</span>
        <small>Редагувати базу</small>
      </div>

    </a>

    <a
      href="{{ url_for('admin_suggestions') }}"
      class="admin-nav-item"
    >

      <img
        src="{{ url_for('static', filename='images/іконка_лампочка.svg') }}"
        alt=""
      />

      <div>
        <span>Пропозиції</span>
        <small>Ідеї відповідників</small>
      </div>

    </a>

    <a
      href="{{ url_for('admin_messages') }}"
      class="admin-nav-item"
    >

      <img
        src="{{ url_for('static', filename='images/іконка_повідомлення.svg') }}"
        alt=""
      />

      <div>
        <span>Повідомлення</span>
        <small>Зв’язок із користувачами</small>
      </div>

    </a>

  </nav>

</header>

<main>

  <section class="edit-card">

    <div class="edit-card-header">
      <h1>Редагування англізма</h1>
    </div>

    <form
      class="edit-form"
      method="POST"
      action="{{ url_for('admin_edit_anglicism', anglicism_id=anglicism.id) }}"
    >

      <input
        type="hidden"
        name="anglicism_id"
        value="{{ anglicism.id }}"
      >

      <div class="form-row">

        <label>

          Англізм

          <div class="editable-field short">

            <span
              class="editable-text"
              contenteditable="true"
              data-input-id="anglicism-word-input"
            >
              {{ anglicism.word }}
            </span>

            <input
              type="hidden"
              id="anglicism-word-input"
              name="word"
              value="{{ anglicism.word }}"
            >

            <button type="button">

              <img
                src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                alt="Редагувати"
              />

            </button>

          </div>

        </label>

        <label>

          Частина мови

          <div class="editable-field short">

            <span
              class="editable-text"
              contenteditable="true"
              data-input-id="part-of-speech-input"
            >
              {{ anglicism.part_of_speech }}
            </span>

            <input
              type="hidden"
              id="part-of-speech-input"
              name="part_of_speech"
              value="{{ anglicism.part_of_speech }}"
            >

            <button type="button">

              <img
                src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                alt="Редагувати"
              />

            </button>

          </div>

        </label>

      </div>

      <div class="form-row">

        <label>

          Написання англійською

          <div class="editable-field short">

            <span
              class="editable-text"
              contenteditable="true"
              data-input-id="english-input"
            >
              {{ anglicism.english_word }}
            </span>

            <input
              type="hidden"
              id="english-input"
              name="english_word"
              value="{{ anglicism.english_word }}"
            >

            <button type="button">

              <img
                src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                alt="Редагувати"
              />

            </button>

          </div>

        </label>

        <label>

          Варіянти написання англізма через кому

          <div class="editable-field short">

            <span
              class="editable-text"
              contenteditable="true"
              data-input-id="variants-input"
            >
              {{ anglicism.variants }}
            </span>

            <input
              type="hidden"
              id="variants-input"
              name="variants"
              value="{{ anglicism.variants }}"
            >

            <button type="button">

              <img
                src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                alt="Редагувати"
              />

            </button>

          </div>

        </label>

      </div>

      <label>

        Тлумачення

        <div class="editable-field large">

          <span
            class="editable-text"
            contenteditable="true"
            data-input-id="definition-input"
          >
            {{ anglicism.definition }}
          </span>

          <input
            type="hidden"
            id="definition-input"
            name="definition"
            value="{{ anglicism.definition }}"
          >

          <button type="button">

            <img
              src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
              alt="Редагувати"
            />

          </button>

        </div>

      </label>

      <label>

        Зауваження

        <div class="editable-field large">

          <span
            class="editable-text"
            contenteditable="true"
            data-input-id="notes-input"
          >
            {{ anglicism.notes }}
          </span>

          <input
            type="hidden"
            id="notes-input"
            name="notes"
            value="{{ anglicism.notes }}"
          >

          <button type="button">

            <img
              src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
              alt="Редагувати"
            />

          </button>

        </div>

      </label>

      <div id="equivalents-container">

        {% for equivalent in equivalents %}

        <div class="equivalent-block">

          <input
            type="hidden"
            name="equivalent_id[]"
            value="{{ equivalent.id }}"
          >

          <label class="short-field">

            <span class="equivalent-title">
              Відповідник {{ loop.index }}
            </span>

            <div class="editable-field short">

              <span
                class="editable-text equivalent-word"
                contenteditable="true"
              >
                {{ equivalent.word }}
              </span>

              <input
                type="hidden"
                name="equivalent_word[]"
                value="{{ equivalent.word }}"
              >

              <button type="button">

                <img
                  src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                  alt="Редагувати"
                />

              </button>

            </div>

          </label>

          <label>

            <span class="meaning-title">
              Тлумачення {{ loop.index }}
            </span>

            <div class="editable-field large">

              <span
                class="editable-text equivalent-definition"
                contenteditable="true"
              >
                {{ equivalent.definition }}
              </span>

              <input
                type="hidden"
                name="equivalent_definition[]"
                value="{{ equivalent.definition }}"
              >

              <button type="button">

                <img
                  src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                  alt="Редагувати"
                />

              </button>

            </div>

          </label>

          <label>

            <span class="example-equivalent-title">
              Приклад вживання відповідника {{ loop.index }}
            </span>

            <div class="editable-field large">

              <span
                class="editable-text equivalent-example"
                contenteditable="true"
              >
                {{ equivalent.example_equivalent }}
              </span>

              <input
                type="hidden"
                name="example_equivalent[]"
                value="{{ equivalent.example_equivalent }}"
              >

              <button type="button">

                <img
                  src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                  alt="Редагувати"
                />

              </button>

            </div>

          </label>

          <label>

            <span class="example-anglicism-title">
              Приклад вживання англізма {{ loop.index }}
            </span>

            <div class="editable-field large">

              <span
                class="editable-text anglicism-example"
                contenteditable="true"
              >
                {{ equivalent.example_anglicism }}
              </span>

              <input
                type="hidden"
                name="example_anglicism[]"
                value="{{ equivalent.example_anglicism }}"
              >

              <button type="button">

                <img
                  src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
                  alt="Редагувати"
                />

              </button>

            </div>

          </label>

          <button
            class="delete-equivalent-button"
            type="button"
          >
            Видалити відповідник
          </button>

        </div>

        {% endfor %}

      </div>

      <button
        class="add-equivalent-button"
        type="button"
      >

        <img
          src="{{ url_for('static', filename='images/іконка_плюсик.svg') }}"
          alt=""
        />

        Додати ще один відповідник

      </button>

      <button
        class="save-button"
        type="submit"
      >
        Зберегти зміни
      </button>

    </form>

  </section>

</main>

<footer class="admin-footer">

  <a
    href="{{ url_for('improve') }}"
    class="user-site-button"
  >
    Користувацький сайт
  </a>

</footer>

<div id="confirm-popup" class="confirm-popup">

  <div class="confirm-window">

    <div class="confirm-header">
      <h2>Увага</h2>
    </div>

    <p class="confirm-text">
      Ви впевнені, що хочете виконати цю дію?
    </p>

    <div class="confirm-actions">

      <button
        class="confirm-yes"
        type="button"
      >
        Так
      </button>

      <button
        class="confirm-no"
        type="button"
      >
        Ні
      </button>

    </div>

  </div>

</div>

<script>

  const confirmPopup = document.getElementById("confirm-popup");
  const confirmText = document.querySelector(".confirm-text");
  const confirmYes = document.querySelector(".confirm-yes");
  const confirmNo = document.querySelector(".confirm-no");

  const equivalentsContainer = document.getElementById("equivalents-container");
  const addEquivalentButton = document.querySelector(".add-equivalent-button");

  let blockToDelete = null;

  function syncEditableFields() {

    document
      .querySelectorAll(".editable-text[data-input-id]")

      .forEach(element => {

        const inputId = element.dataset.inputId;

        const hiddenInput = document.getElementById(inputId);

        if (!hiddenInput) return;

        element.addEventListener("input", () => {

          hiddenInput.value = element.textContent.trim();

        });

      });

    document
      .querySelectorAll(".equivalent-block")

      .forEach(block => {

        const wordSpan = block.querySelector(".equivalent-word");

        const wordInput = block.querySelector(
          'input[name="equivalent_word[]"]'
        );

        const definitionSpan = block.querySelector(
          ".equivalent-definition"
        );

        const definitionInput = block.querySelector(
          'input[name="equivalent_definition[]"]'
        );

        const exampleEquivalentSpan = block.querySelector(
          ".equivalent-example"
        );

        const exampleEquivalentInput = block.querySelector(
          'input[name="example_equivalent[]"]'
        );

        const anglicismExampleSpan = block.querySelector(
          ".anglicism-example"
        );

        const anglicismExampleInput = block.querySelector(
          'input[name="example_anglicism[]"]'
        );

        if (wordSpan && wordInput) {

          wordSpan.addEventListener("input", () => {

            wordInput.value = wordSpan.textContent.trim();

          });

        }

        if (definitionSpan && definitionInput) {

          definitionSpan.addEventListener("input", () => {

            definitionInput.value = definitionSpan.textContent.trim();

          });

        }

        if (exampleEquivalentSpan && exampleEquivalentInput) {

          exampleEquivalentSpan.addEventListener("input", () => {

            exampleEquivalentInput.value = exampleEquivalentSpan
              .textContent
              .trim();

          });

        }

        if (anglicismExampleSpan && anglicismExampleInput) {

          anglicismExampleSpan.addEventListener("input", () => {

            anglicismExampleInput.value = anglicismExampleSpan
              .textContent
              .trim();

          });

        }

      });

  }

  function openConfirm(text) {

    confirmText.textContent = text;

    confirmPopup.classList.add("show");

  }

  function closeConfirm() {

    confirmPopup.classList.remove("show");

    blockToDelete = null;

  }

  function isBlockFilled(block) {

    const editableFilled = Array
      .from(block.querySelectorAll(".editable-text"))

      .some(field => field.textContent.trim() !== "");

    return editableFilled;

  }

  function updateEquivalentNumbers() {

    const blocks = equivalentsContainer.querySelectorAll(
      ".equivalent-block"
    );

    blocks.forEach((block, index) => {

      const number = index + 1;

      block.querySelector(".equivalent-title").textContent =
        `Відповідник ${number}`;

      block.querySelector(".meaning-title").textContent =
        `Тлумачення ${number}`;

      block.querySelector(".example-equivalent-title").textContent =
        `Приклад вживання відповідника ${number}`;

      block.querySelector(".example-anglicism-title").textContent =
        `Приклад вживання англізма ${number}`;

    });

    blocks.forEach(block => {

      const deleteButton = block.querySelector(
        ".delete-equivalent-button"
      );

      deleteButton.style.display =
        blocks.length > 1
          ? "flex"
          : "none";

    });

  }

  function createEquivalentBlock() {

    const number =
      equivalentsContainer
        .querySelectorAll(".equivalent-block")
        .length + 1;

    const block = document.createElement("div");

    block.className = "equivalent-block";

    block.innerHTML = `

      <input type="hidden" name="equivalent_id[]" value="new">

      <label class="short-field">

        <span class="equivalent-title">
          Відповідник ${number}
        </span>

        <div class="editable-field short">

          <span
            class="editable-text equivalent-word"
            contenteditable="true"
          ></span>

          <input
            type="hidden"
            name="equivalent_word[]"
            value=""
          >

          <button type="button">

            <img
              src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
              alt="Редагувати"
            />

          </button>

        </div>

      </label>

      <label>

        <span class="meaning-title">
          Тлумачення ${number}
        </span>

        <div class="editable-field large">

          <span
            class="editable-text equivalent-definition"
            contenteditable="true"
          ></span>

          <input
            type="hidden"
            name="equivalent_definition[]"
            value=""
          >

          <button type="button">

            <img
              src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
              alt="Редагувати"
            />

          </button>

        </div>

      </label>

      <label>

        <span class="example-equivalent-title">
          Приклад вживання відповідника ${number}
        </span>

        <div class="editable-field large">

          <span
            class="editable-text equivalent-example"
            contenteditable="true"
          ></span>

          <input
            type="hidden"
            name="example_equivalent[]"
            value=""
          >

          <button type="button">

            <img
              src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
              alt="Редагувати"
            />

          </button>

        </div>

      </label>

      <label>

        <span class="example-anglicism-title">
          Приклад вживання англізма ${number}
        </span>

        <div class="editable-field large">

          <span
            class="editable-text anglicism-example"
            contenteditable="true"
          ></span>

          <input
            type="hidden"
            name="example_anglicism[]"
            value=""
          >

          <button type="button">

            <img
              src="{{ url_for('static', filename='images/іконка_редагувати.svg') }}"
              alt="Редагувати"
            />

          </button>

        </div>

      </label>

      <button
        class="delete-equivalent-button"
        type="button"
      >
        Видалити відповідник
      </button>
    `;

    return block;

  }

  addEquivalentButton.addEventListener("click", () => {

    const newBlock = createEquivalentBlock();

    equivalentsContainer.appendChild(newBlock);

    updateEquivalentNumbers();

    syncEditableFields();

  });

  equivalentsContainer.addEventListener("click", event => {

    const deleteButton = event.target.closest(
      ".delete-equivalent-button"
    );

    if (!deleteButton) return;

    const blocks = equivalentsContainer.querySelectorAll(
      ".equivalent-block"
    );

    if (blocks.length <= 1) return;

    const block = deleteButton.closest(".equivalent-block");

    if (isBlockFilled(block)) {

      blockToDelete = block;

      openConfirm(
        "Ви впевнені, що хочете видалити відповідник?"
      );

    }

    else {

      block.remove();

      updateEquivalentNumbers();

    }

  });

  confirmNo.addEventListener("click", closeConfirm);

  confirmYes.addEventListener("click", () => {

    confirmPopup.classList.remove("show");

    if (blockToDelete) {

      blockToDelete.remove();

      updateEquivalentNumbers();

    }

    blockToDelete = null;

  });

document.addEventListener("click", event => {
  const editButton = event.target.closest(".editable-field button");

  if (!editButton) return;

  const field = editButton.closest(".editable-field");
  const editableText = field.querySelector(".editable-text");

  if (!editableText) return;

  field.style.background = "#ffffff";

  editableText.focus();

  const range = document.createRange();
  range.selectNodeContents(editableText);
  range.collapse(false);

  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
});


document.addEventListener("focusout", event => {
  const editableText = event.target.closest(".editable-text");

  if (!editableText) return;

  const field = editableText.closest(".editable-field");

  if (field) {
    field.style.background = "";
  }
});

  syncEditableFields();

  updateEquivalentNumbers();

</script>

</body>
</html>
